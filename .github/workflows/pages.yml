name: Deploy GUI to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.1"
      - name: Install & build GUI
        working-directory: gui
        run: |
          npm install
          npm run build
        env:
          SENTRY_SUPPRESS_UPLOADING_SOURCEMAPS: "true"   # build needs no Sentry account
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gui/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
